<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Security Headers -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; 
                   script-src 'self' 'unsafe-inline' https://www.gstatic.com https://cdn.jsdelivr.net; 
                   style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; 
                   font-src 'self' https://cdn.jsdelivr.net; 
                   img-src 'self' data:; 
                   connect-src 'self' https://bagdatech.app.n8n.cloud;">
    <meta http-equiv="X-Content-Type-Options" content="nosniff">
    <meta http-equiv="X-Frame-Options" content="DENY">
    <meta http-equiv="Referrer-Policy" content="strict-origin-when-cross-origin">
    <meta http-equiv="Permissions-Policy" content="geolocation=(), microphone=(), camera=()">

    <title>Eloy AI - Chat</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
        integrity="sha384-XGjxtQfXaH2tnPFa9x+ruJTuLE3Aa6LhHSWRr1XeTyhezb4abCG4ccI5AkVDxqC+" crossorigin="anonymous">
    <script src="script.js"></script>
    <script src="security-utils.js"></script>
</head>

<body class="app-layout">

    <div id="effects-container" class="background-effects"></div>

    <header class="global-header">
        <a href="index.html" class="chat-header-link" title="Voltar">
            <i class="bi bi-arrow-left"></i> Home
        </a>

        <div class="model-name">
            <i class="bi bi-stars" style="color:var(--primary-color)"></i> Eloy AI
        </div>

        <div class="nav-links">
            <a href="updates.html" class="nav-link" style="font-size: 0.9rem; margin-right: 8px;">Atualizações</a>
            <button id="theme-toggle" class="btn-toggle-theme" title="Alternar Tema">
                <i class="bi bi-moon-stars-fill"></i>
            </button>
        </div>
    </header>

    <main id="chat-history" class="chat-main">
        <div class="message">
            <div class="avatar ai"><i class="bi bi-robot"></i></div>
            <div class="content">
                <strong>Eloy</strong>
                <p>👋 Olá! Sou a <strong>Eloy</strong>, sua assistente virtual premium. Com o que posso ajudar hoje?</p>
            </div>
        </div>
    </main>

    <footer class="chat-footer">
        <div id="progress-bar" class="progress-line"></div>

        <div class="input-container">
            <textarea id="user-input" class="chat-input" placeholder="Pergunte algo..." rows="1"></textarea>
            <button id="send-btn" class="send-btn"><i class="bi bi-send-fill"></i></button>
        </div>
    </footer>

    <script>
        // --- LÓGICA DO BOT ---
        const chatHistory = document.getElementById('chat-history');
        const userInput = document.getElementById('user-input');
        const sendBtn = document.getElementById('send-btn');
        const progressBar = document.getElementById('progress-bar');

        const webhookUrl = 'https://bagdatech.app.n8n.cloud/webhook/49f689c9-bc02-4478-bca1-4261e1c74fbe/chat';
        let sessionId = safeLocalStorageGet('chatSessionId') || crypto.randomUUID();
        safeLocalStorageSet('chatSessionId', sessionId);

        let isSending = false; // Prevenir envios duplicados

        // Auto-Resize Textarea
        userInput.addEventListener('input', function () {
            this.style.height = 'auto';
            this.style.height = (this.scrollHeight) + 'px';
            if (this.value === '') this.style.height = 'auto';
        });

        function appendMessage(role, text) {
            const div = document.createElement('div');
            div.className = 'message';
            const iconClass = role === 'user' ? 'bi-person-fill' : 'bi-robot';
            const name = role === 'user' ? 'Você' : 'Eloy';
            const avatarClass = role === 'user' ? 'user' : 'ai';

            // PROTEÇÃO XSS: usar textContent em vez de innerHTML
            const avatar = document.createElement('div');
            avatar.className = `avatar ${avatarClass}`;
            avatar.innerHTML = `<i class="bi ${iconClass}"></i>`;

            const content = document.createElement('div');
            content.className = 'content';

            const strong = document.createElement('strong');
            strong.textContent = name;

            const p = document.createElement('p');
            p.textContent = text; // Sempre usar textContent para evitar XSS

            content.appendChild(strong);
            content.appendChild(p);
            div.appendChild(avatar);
            div.appendChild(content);

            chatHistory.appendChild(div);
            chatHistory.scrollTop = chatHistory.scrollHeight;
        }

        async function sendMessage() {
            // Prevenir envios duplicados
            if (isSending) return;

            const text = userInput.value.trim();
            if (!text) return;

            // VALIDAÇÃO DE INPUT
            const validation = validateInput(text, 2000);
            if (!validation.valid) {
                appendMessage('ai', `⚠️ ${validation.message}`);
                return;
            }

            // RATE LIMITING
            const rateCheck = checkRateLimit('chat_send', 10, 30000); // 10 msg/30s
            if (!rateCheck.allowed) {
                const waitSeconds = Math.ceil((rateCheck.resetTime - Date.now()) / 1000);
                appendMessage('ai', `⏱️ Aguarde ${waitSeconds} segundos antes de enviar mais mensagens.`);
                return;
            }

            isSending = true;
            sendBtn.disabled = true;
            userInput.value = '';
            userInput.style.height = 'auto';

            appendMessage('user', validation.sanitized);
            progressBar.classList.add('loading');
            userInput.focus();

            const loadingDiv = document.createElement('div');
            loadingDiv.className = 'message';
            loadingDiv.id = 'loading-msg';
            loadingDiv.innerHTML = `
                <div class="avatar ai"><i class="bi bi-robot"></i></div>
                <div class="content"><strong>Eloy</strong><div class="typing-indicator"><span></span><span></span><span></span></div></div>
            `;
            chatHistory.appendChild(loadingDiv);
            chatHistory.scrollTop = chatHistory.scrollHeight;

            try {
                // Timeout de 30 segundos
                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), 30000);

                const res = await fetch(webhookUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        sessionId: sessionId,
                        chatInput: validation.sanitized
                    }),
                    signal: controller.signal
                });

                clearTimeout(timeoutId);

                loadingDiv.remove();
                progressBar.classList.remove('loading');
                const rawText = await res.text();

                if (!res.ok) throw new Error(`Erro ${res.status}`);

                let data;
                try { data = JSON.parse(rawText); } catch (e) {
                    appendMessage('ai', rawText || "Sem conteúdo."); return;
                }

                let reply = "Sem resposta.";
                if (Array.isArray(data) && data.length > 0) {
                    reply = data[0].output || data[0].text || data[0].message || JSON.stringify(data[0]);
                } else if (typeof data === 'object') {
                    reply = data.output || data.text || data.message || JSON.stringify(data);
                } else {
                    reply = String(data);
                }

                // Sanitizar resposta do bot também
                appendMessage('ai', escapeHTML(reply));

            } catch (err) {
                const el = document.getElementById('loading-msg');
                if (el) el.remove();
                progressBar.classList.remove('loading');

                if (err.name === 'AbortError') {
                    appendMessage('ai', '⏱️ Tempo esgotado. Tente novamente.');
                } else {
                    appendMessage('ai', '⚠️ Não consegui conectar. Tente novamente.');
                }
            } finally {
                isSending = false;
                sendBtn.disabled = false;
                userInput.focus();
            }
        }

        sendBtn.addEventListener('click', sendMessage);
        userInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });

        userInput.focus();
    </script>
</body>


</html>
